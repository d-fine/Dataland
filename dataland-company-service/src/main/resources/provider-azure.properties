# Azure OpenAI (Responses API via the openai-java SDK).
# Only loaded if dataland.company-service.provider=azure. Authentication via API key.
# All values come from the environment, nothing is hardcoded here.
# AZURE_OPENAI_ENDPOINT must end with /openai/v1 so that the Azure v1 API is used (no api-version needed).
dataland.company-service.azure.endpoint=${AZURE_OPENAI_ENDPOINT:}
dataland.company-service.azure.api-key=${AZURE_OPENAI_API_KEY:}
# With the v1 API, the deployment is selected via the model field of the request.
dataland.company-service.azure.deployment-name=${AZURE_OPENAI_DEPLOYMENT_NAME:}
dataland.company-service.azure.reasoning-effort=${AZURE_OPENAI_REASONING_EFFORT:medium}
# Type of the hosted web search tool of the Responses API: web_search, web_search_preview (depending on what the
# deployment supports) or none to disable web search.
dataland.company-service.azure.web-search-tool-type=${AZURE_OPENAI_WEB_SEARCH_TOOL_TYPE:web_search}
# Upper bound for the number of tool-calling rounds per proxy search, to avoid endless loops.
dataland.company-service.azure.max-tool-rounds=10
# Overall time limit for one proxy research (all requests to Azure OpenAI incl. tool-calling rounds).
# TIMEOUT CHAIN for the AI-based proxy search - these three values depend on each other, keep them in sync:
#   1. dataland-company-service/src/main/resources/provider-azure.properties: dataland.company-service.azure.max-research-duration (240s)
#   2. dataland-backend/src/main/resources/application.properties: dataland.company-service.read-timeout-seconds (270s)
#   3. dataland-inbound-proxy/templates/common.template: proxy_read_timeout of /api/company-proxies/ (300s)
# Required order: 1 < 2 < 3, so that the 503 of the proxy finder arrives instead of a cut connection.
dataland.company-service.azure.max-research-duration=240s
dataland.company-service.azure.max-retries=2
