springdoc.show-actuator=true
management.endpoints.web.exposure.include=health, info
management.endpoint.health.show-details=always
management.info.git.mode=FULL
server.tomcat.threads.min-spare=100
server.shutdown=graceful
server.servlet.context-path=/company-service
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://${PROXY_PRIMARY_URL:local-dev.dataland.com}/keycloak/realms/datalandsecurity
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://keycloak:8080/keycloak/realms/datalandsecurity/protocol/openid-connect/certs
dataland.authorization.publiclinks=/actuator/health,/actuator/health/ping,/actuator/info,/v3/api-docs/**
spring.jackson2.deserialization.fail-on-unknown-properties=true
spring.web.error.whitelabel.enabled=false
spring.mvc.log-resolved-exception=true
spring.web.resources.add-mappings=false
dataland.expose-error-stack-trace-to-api=false
dataland.backend.base-url=${INTERNAL_BACKEND_URL:http://backend:8080/api}
dataland.keycloak.base-url=http://keycloak:8080/keycloak
dataland.keycloak.client-id=dataland-company-service
dataland.keycloak.client-secret=${DATALAND_COMPANY_SERVICE_CLIENT_SECRET}

# Configuration of the mocked proxy suggestion provider. The suggested proxy company is resolved via its LEI,
# because company IDs differ between environments.
dataland.company-service.mock.proxy-company-lei=${COMPANY_SERVICE_MOCK_PROXY_COMPANY_LEI:3VtVfvDAmT9vm0VBcrp9}

springdoc.api-docs.version=OPENAPI_3_0
# Temporary workaround (see https://github.com/OpenAPITools/openapi-generator/issues/10053)
spring.http.converters.preferred-json-mapper=jackson2
