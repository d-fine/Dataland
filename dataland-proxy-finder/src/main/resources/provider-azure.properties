# Azure OpenAI via Spring AI's OpenAI starter (Microsoft Foundry mode).
# Only loaded if dataland.proxy-finder.provider=azure. Authentication via API key.
# All values come from the environment, nothing is hardcoded here.
# AZURE_OPENAI_ENDPOINT must end with /openai/v1 so that the Azure v1 API is used (no api-version needed).
# Note: the spring.ai.openai.chat.options.* keys are deprecated since Spring AI 2.0 and partly ignored, so they must
# not be used here.
spring.ai.model.chat=openai
spring.ai.openai.base-url=${AZURE_OPENAI_ENDPOINT}
spring.ai.openai.api-key=${AZURE_OPENAI_API_KEY}
spring.ai.openai.microsoft-foundry=true
spring.ai.openai.microsoft-deployment-name=${AZURE_OPENAI_DEPLOYMENT_NAME}
# With the v1 API, the deployment is selected via the model field of the request.
spring.ai.openai.chat.model=${AZURE_OPENAI_DEPLOYMENT_NAME}
# Reasoning models reject a custom temperature, so it is not set by default. Set AZURE_OPENAI_TEMPERATURE only
# for non-reasoning deployments by adding spring.ai.openai.chat.temperature=${AZURE_OPENAI_TEMPERATURE}.
spring.ai.openai.chat.reasoning-effort=${AZURE_OPENAI_REASONING_EFFORT:medium}
# Timeouts for calls to Azure OpenAI (web search and tool calls can take a while).
spring.http.clients.connect-timeout=10s
spring.http.clients.read-timeout=120s
