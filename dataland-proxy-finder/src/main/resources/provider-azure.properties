# Azure OpenAI (Responses API via the openai-java SDK).
# Only loaded if dataland.proxy-finder.provider=azure. Authentication via API key.
# All values come from the environment, nothing is hardcoded here.
# AZURE_OPENAI_ENDPOINT must end with /openai/v1 so that the Azure v1 API is used (no api-version needed).
dataland.proxy-finder.azure.endpoint=${AZURE_OPENAI_ENDPOINT:}
dataland.proxy-finder.azure.api-key=${AZURE_OPENAI_API_KEY:}
# With the v1 API, the deployment is selected via the model field of the request.
dataland.proxy-finder.azure.deployment-name=${AZURE_OPENAI_DEPLOYMENT_NAME:}
dataland.proxy-finder.azure.reasoning-effort=${AZURE_OPENAI_REASONING_EFFORT:medium}
# Type of the hosted web search tool of the Responses API: web_search, web_search_preview (depending on what the
# deployment supports) or none to disable web search.
dataland.proxy-finder.azure.web-search-tool-type=${AZURE_OPENAI_WEB_SEARCH_TOOL_TYPE:web_search}
# Upper bound for the number of tool-calling rounds per proxy search, to avoid endless loops.
dataland.proxy-finder.azure.max-tool-rounds=10
# Overall time limit for one proxy research (all requests to Azure OpenAI incl. tool-calling rounds). Must be lower
# than the timeouts of the callers (backend HTTP client, inbound proxy /api/company-proxies/), so that a clear 503 is
# returned instead of a cut connection.
dataland.proxy-finder.azure.max-research-duration=240s
dataland.proxy-finder.azure.max-retries=2
